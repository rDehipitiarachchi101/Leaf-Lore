spring.application.name=leaflore

# Local Postgres from ../docker-compose.yml (override with env vars elsewhere)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/leaflore}
spring.datasource.username=${DB_USER:leaflore}
spring.datasource.password=${DB_PASSWORD:leaflore}

# Flyway owns the schema; Hibernate only checks that entities match it
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Error responses as RFC 9457 problem details
spring.mvc.problemdetails.enabled=true

# Until real login exists, every request acts as this seeded user
leaflore.demo-user-id=1
